<a
	[class]="
		getLinkClasses(
			'border-b-1 border-transparent pb-0.5 hover:border-primary'
		)
	"
	[routerLink]="type() === 'navigation' ? href() : undefined"
	[href]="type() === 'external' ? href() : undefined"
>
	<app-typography color="primary" as="span">
		<ng-content />
	</app-typography>
</a>
