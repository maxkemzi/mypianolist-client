<label>
	<app-typography class="block mb-2" as="span">{{ label() }}</app-typography>
	<input
		appInput
		[value]="value"
		[type]="type()"
		[placeholder]="placeholder()"
		[disabled]="disabled"
		(input)="handleInput($event)"
		(blur)="onTouched()"
	/>
</label>
@if (error()) {
	<app-typography class="block mt-1" variant="body2" color="danger">
		{{ error() }}
	</app-typography>
}
