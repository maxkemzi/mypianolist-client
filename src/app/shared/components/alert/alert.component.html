<div appModal>
	<h3 class="text-center mb-1">{{ title() }}</h3>
	<ng-content />
	<div class="flex items-center gap-4 justify-center">
		<button appButton variant="outline" type="button" (click)="onCancel()">
			Cancel
		</button>
		<button
			appButton
			type="button"
			[disabled]="confirmIsDisabled()"
			(click)="onConfirm()"
		>
			Confirm
		</button>
	</div>
</div>
