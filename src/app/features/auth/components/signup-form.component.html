<app-form [formGroup]="form" (ngSubmit)="onSubmit()">
	<app-typography class="block mb-7" textClass="text-center" variant="h1"
		>Signup</app-typography
	>
	<div class="flex flex-col gap-4 mb-7">
		<app-form-field
			formControlName="username"
			label="Username"
			placeholder="username"
			[error]="usernameError"
		/>
		<app-form-field
			formControlName="email"
			label="Email"
			placeholder="email"
			[error]="emailError"
		/>
		<app-form-field
			formControlName="password"
			label="Password"
			placeholder="password"
			type="password"
			[error]="passwordError"
		/>
	</div>
	<app-button
		class="block mb-2"
		buttonClass="w-full"
		submit
		[disabled]="!form.valid"
		>Sign Up</app-button
	>
	<app-typography>
		Already have an account? <app-link href="/auth/login">Log In</app-link>
	</app-typography>
</app-form>
