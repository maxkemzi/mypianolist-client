<app-form>
	<app-typography class="mb-7 text-center" variant="h1">Signup</app-typography>
	<div class="flex flex-col gap-4 mb-7">
		<app-form-field label="Username" placeholder="username" />
		<app-form-field label="Email" placeholder="email" />
		<app-form-field label="Password" placeholder="password" type="password" />
	</div>
	<app-button class="w-full mb-2" submit>Sign Up</app-button>
	<p>
		Already have an account? <app-link href="/auth/login">Log In</app-link>
	</p>
</app-form>
