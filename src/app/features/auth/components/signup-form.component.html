<form appForm [formGroup]="form" (ngSubmit)="onSubmit()">
	<h1 class="mb-7 text-center">Signup</h1>
	<div class="flex flex-col gap-4 mb-7">
		<app-form-field label="Username" [error]="usernameError">
			<input appInput formControlName="username" placeholder="username" />
		</app-form-field>

		<app-form-field label="Email" [error]="emailError">
			<input appInput formControlName="email" placeholder="email" />
		</app-form-field>

		<app-form-field label="Password" [error]="passwordError">
			<input
				appInput
				formControlName="password"
				placeholder="password"
				type="password"
			/>
		</app-form-field>
	</div>
	<button appButton class="mb-2 w-full" type="submit" [disabled]="!form.valid">
		Sign Up
	</button>
	<p>
		Already have an account? <a appLink routerLink="/auth/login">Log In</a>
	</p>
</form>
