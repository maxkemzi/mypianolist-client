<form appForm [formGroup]="form" (ngSubmit)="onSubmit()">
	<h1 class="mb-7 text-center">Login</h1>
	<div class="flex flex-col gap-4 mb-7">
		<app-form-field
			formControlName="username"
			label="Username"
			placeholder="username"
			[error]="usernameError"
		/>
		<app-form-field
			formControlName="password"
			label="Password"
			placeholder="password"
			type="password"
			[error]="passwordError"
		/>
	</div>
	<button appButton class="mb-2 w-full" type="submit" [disabled]="!form.valid">
		Log In
	</button>
	<p>
		Don't have an account? <a appLink routerLink="/auth/signup">Sign Up</a>
	</p>
</form>
