<form appModal [formGroup]="form" (ngSubmit)="onSubmit()">
	<h1 class="mb-7 text-center">Login</h1>
	@if (error) {
		<p class="mb-4" color="error">{{ error }}</p>
	}
	<div class="flex flex-col gap-4 mb-7">
		<app-form-field label="Username" [error]="usernameError">
			<input appInput formControlName="username" placeholder="username" />
		</app-form-field>

		<app-form-field label="Password" [error]="passwordError">
			<input
				appInput
				formControlName="password"
				placeholder="password"
				type="password"
			/>
		</app-form-field>
	</div>
	<button appButton class="mb-2 w-full" type="submit" [disabled]="isLoading()">
		Log In
	</button>
	<p>
		Don't have an account? <a appLink routerLink="/auth/signup">Sign Up</a>
	</p>
</form>
