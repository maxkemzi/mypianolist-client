<form appForm class="bg-background-darker" [formGroup]="form">
	<h3 class="text-center mb-1">Add Piece to My List</h3>
	<p class="text-center" color="primary" weight="semibold">
		{{ piece().title }}
	</p>
	<p class="text-center mb-4">By F. F. Chopin</p>

	<div class="flex flex-col gap-4 mb-7">
		<app-form-field
			formControlName="status"
			label="Status"
			placeholder="Select Status"
			[error]="statusError"
		/>

		<app-form-field
			formControlName="startDate"
			label="Start Date"
			placeholder="DD/MM/YY"
			[error]="startDateError"
		/>

		<app-form-field
			formControlName="finishDate"
			label="Finish Date"
			placeholder="DD/MM/YY"
			[error]="finishDateError"
		/>
	</div>

	<button appButton class="w-full" type="submit" [disabled]="!form.valid">
		Submit
	</button>
</form>
