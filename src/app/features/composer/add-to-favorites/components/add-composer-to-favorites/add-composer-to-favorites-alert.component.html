<div appModal>
	<h3 class="text-center mb-1">Add Composer to Favorites</h3>
	<p class="text-center mb-7" color="primary" weight="semibold">
		{{ composerName() }}
	</p>

	<div class="flex items-center gap-4 justify-center">
		<button appButton variant="outline" (click)="onCancel()">Cancel</button>
		<button appButton [disabled]="isLoading()" (click)="onConfirm()">
			Add
		</button>
	</div>
</div>
