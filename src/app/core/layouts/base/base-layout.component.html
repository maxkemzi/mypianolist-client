<app-header absolute>
	<app-logo slot="left-1" />
	<app-navbar slot="left-2" />
	<ng-container slot="right">
		@if (auth.user(); as user) {
			<app-profile [username]="user.username" [avatar]="user.avatar" />
		}

		@if (auth.user() === null) {
			<app-auth-buttons />
		}
	</ng-container>
</app-header>

<main>
	<router-outlet />
</main>
