<div
	class="relative h-[200px] flex items-center justify-center rounded-lg overflow-hidden"
>
	<app-typography textClass="capitalize" variant="h2" weight="medium">{{
		genre().name
	}}</app-typography>
	<div
		class="absolute top-0 left-0 w-full h-full z-[-1] bg-center bg-cover before:absolute before:top-0 before:left-0 before:w-full before:h-full before:bg-background/50"
		[style]="`backgroundImage: url(${imagePath()});`"
	></div>
</div>
