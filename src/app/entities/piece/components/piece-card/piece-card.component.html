<app-piece-image
	class="shrink-0 max-sm:hidden"
	[piece]="piece()"
	[color]="isEven() ? 'background' : 'surface'"
	width="115px"
/>
<div class="flex flex-col justify-between gap-2 overflow-hidden sm:grow">
	<div class="flex items-start justify-between gap-4">
		<div class="overflow-hidden">
			<a [routerLink]="['/pieces', piece().id]">
				<p class="truncate" weight="bold" color="primary">
					{{ piece().title }}
				</p>
			</a>
			<p class="truncate">
				By
				<a [routerLink]="['/composers', piece().composer.id]">
					<span color="primary">{{ composerName() }}</span>
				</a>
			</p>
		</div>
		<div class="flex items-center gap-1">
			<p>{{ piece().learners.toLocaleString() }}</p>
			<i class="ph-fill ph-user text-xl"></i>
		</div>
	</div>
	<p class="line-clamp-2">{{ piece().description }}</p>
	<div class="flex items-end justify-between gap-4">
		@if (!hideGenre()) {
			<div
				class="py-1.5 px-2.5 rounded-lg"
				[class.bg-surface]="!isEven()"
				[class.bg-background]="isEven()"
			>
				<p class="capitalize" variant="body2">
					{{ piece().genre.name }}
				</p>
			</div>
		}

		<ng-content select="[slot=bottom-right]" />
	</div>
</div>
