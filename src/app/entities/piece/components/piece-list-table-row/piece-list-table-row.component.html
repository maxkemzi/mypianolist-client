<td [class]="'w-1' + ` ${statusBgColorClass()}`"></td>
<td>
	<span>{{ number() }}</span>
</td>
<td>
	<a [routerLink]="['/pieces', piece().id]">
		<span weight="medium" color="primary">
			{{ piece().title }}
		</span>
	</a>
</td>
<td>
	<span>{{ composerName() }}</span>
</td>
<td>
	<span>{{ piece().genre.name }}</span>
</td>
<td>
	<span weight="medium">
		{{ piece().score || '-' }}
	</span>
</td>
<td>
	<ng-content select="[slot=actions]" />
</td>
