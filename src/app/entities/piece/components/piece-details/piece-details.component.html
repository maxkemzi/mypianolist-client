<h2>{{ piece().title }}</h2>
<h3 class="mb-4" weight="normal">By {{ composerName() }}</h3>
<ul class="flex gap-4 mb-4 max-sm:flex-col max-sm:gap-2">
	<li>
		<app-info-item title="Genre" [value]="piece().genre.name" />
	</li>

	<li>
		<app-info-item title="Year" [value]="composedDate()" />
	</li>

	<li>
		<app-info-item
			title="Learners"
			[value]="piece().learners.toLocaleString()"
		/>
	</li>

	<li>
		<app-info-item
			title="Favorites"
			[value]="piece().favorites.toLocaleString()"
		/>
	</li>
</ul>
<ng-content select="[slot=actions]" />
<p class="mb-7">{{ piece().description }}</p>
<div>
	<h3 class="mb-4" weight="bold">Composer</h3>
	<a class="inline-block" [routerLink]="['/composers', piece().composer.id]">
		<div class="flex gap-2">
			<app-composer-image [composer]="piece().composer" width="90px" />
			<div>
				<p color="primary">{{ composerName() }}</p>
				<p variant="body2">{{ composerLifeSpan() }}</p>
			</div>
		</div>
	</a>
</div>
