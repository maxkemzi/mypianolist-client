<div class="h-[88px] mb-10"></div>
<section>
	<div appContainer size="md">
		<h1 class="text-center mb-7">Settings</h1>
		@if (profile.data(); as profile) {
			<div class="grid grid-cols-2 gap-6">
				<div>
					<h2 class="mb-4">Account</h2>
					<app-username-form [defaultUsername]="profile.username" />
				</div>
				<div>
					<h2 class="mb-4">Profile</h2>
					<div class="flex flex-col items-start gap-4">
						<app-avatar-form
							[(defaultAvatar)]="profile.avatar"
							[username]="profile.username"
						/>
						<app-biography-form
							class="w-full"
							[defaultBiography]="profile.biography"
						/>
					</div>
				</div>
			</div>
		}
	</div>
</section>
