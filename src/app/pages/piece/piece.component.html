<div class="h-[88px] mb-10"></div>
<section>
	<div appContainer size="md">
		@if (fetchPieceById.data() === undefined) {
			<p>Loading...</p>
		}

		@if (fetchPieceById.data() === null) {
			<p>The piece doesn't exist.</p>
		}

		@if (fetchPieceById.data(); as piece) {
			<app-piece-details [piece]="piece" />
		}
	</div>
</section>
