<div class="h-[88px] mb-10"></div>
<section>
	<app-container size="md">
		<h1 class="mb-8 text-center">Catalog</h1>
		<div class="grid grid-cols-3 gap-4">
			<a routerLink="/pieces">
				<app-genre-card />
			</a>
			@for (genre of genres; track genre.id) {
				<a routerLink="/pieces" [queryParams]="{genre: genre.name}">
					<app-genre-card [genre]="genre" />
				</a>
			}
		</div>
	</app-container>
</section>
