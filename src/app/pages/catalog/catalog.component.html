<div class="h-[88px] mb-10"></div>
<section>
	<div appContainer size="md">
		<h1 class="mb-8 text-center">Catalog</h1>
		@if (fetchAllGenres.isLoading()) {
			<p>Loading...</p>
		} @else if (fetchAllGenres.hasError()) {
			<p>Something went wrong.</p>
		} @else if (fetchAllGenres.data().length === 0) {
			<p>There are no genres.</p>
		} @else {
			<div class="grid grid-cols-3 gap-4">
				<a routerLink="/pieces">
					<app-genre-card />
				</a>
				@for (genre of fetchAllGenres.data(); track genre.id) {
					<a routerLink="/pieces" [queryParams]="{genre: genre.name}">
						<app-genre-card [genre]="genre" />
					</a>
				}
			</div>
		}
	</div>
</section>
