<div class="h-[88px] mb-10"></div>
<section>
	<app-container size="md">
		<app-typography
			class="block mb-7"
			textClass="text-center capitalize"
			variant="h1"
			>{{ title() }}</app-typography
		>
		<form class="flex justify-center mb-7" (ngSubmit)="handleSearch()">
			<div class="relative">
				@if (searchQuery().trim().length > 0) {
					<button type="button" (click)="handleClearSearch()">
						<i [class]="'ph ph-x ' + iconClasses"></i>
					</button>
				} @else {
					<i [class]="'ph ph-magnifying-glass ' + iconClasses"></i>
				}

				<input
					appInput
					class="pl-14 rounded-tr-none rounded-br-none"
					placeholder="Search Pieces..."
					[value]="searchQuery()"
					(input)="handleInputSearch($event)"
				/>
			</div>
			<div>
				<button
					appButton
					class="h-full rounded-tl-none rounded-bl-none"
					type="submit"
				>
					Search
				</button>
			</div>
		</form>
		<div class="flex justify-between items-center mb-7">
			<app-typography
				>Pieces
				<app-typography as="span" weight="bold">{{
					pieces.totalCount()
				}}</app-typography>
			</app-typography>
			<div class="relative">
				<button
					class="flex items-center gap-2"
					type="button"
					(click)="toggleSortDropdownIsOpen()"
				>
					<app-typography as="span">Sort by</app-typography>

					<i class="ph ph-caret-down"></i>
				</button>
				@if (sortDropdownIsOpen()) {
					<app-dropdown
						class="absolute top-full left-0 min-w-full pt-2"
						(onClickOutside)="handleClickOutside()"
					>
						<app-dropdown-item>Learners</app-dropdown-item>
						<app-dropdown-item>Favorites</app-dropdown-item>
					</app-dropdown>
				}
			</div>
		</div>
		<div class="rounded-lg overflow-hidden">
			@for (piece of pieces.data(); track piece.id; let i = $index) {
				<app-piece-card
					[piece]="piece"
					[variant]="(i + 1) % 2 === 0 ? 'even' : 'odd'"
					[hideGenre]="!!genre()"
				></app-piece-card>
			}
		</div>
	</app-container>
</section>
