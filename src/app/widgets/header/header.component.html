<header
	class="h-[88px] py-6 bg-background z-50"
	[ngClass]="{'absolute top-0 left-0 w-full': absolute}"
>
	<app-container class="h-full">
		<div class="h-full flex justify-between items-center">
			<div class="flex items-center gap-7">
				<ng-content select="[slot=left-1]" />
				<ng-content select="[slot=left-2]" />
			</div>
			<ng-content select="[slot=right]" />
		</div>
	</app-container>
</header>
