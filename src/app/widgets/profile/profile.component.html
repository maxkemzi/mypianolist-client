<div class="relative" (appClickOutside)="onClickOutside()">
	<button
		class="flex items-center gap-2"
		type="button"
		(click)="toggleDropdownIsOpen()"
	>
		<span weight="semibold">{{ username() }}</span>
		<i class="ph-fill ph-caret-down"></i>
	</button>
	@if (dropdownIsOpen()) {
		<app-dropdown-menu class="absolute top-full left-0 min-w-full pt-2">
			<app-dropdown-item (appClick)="onProfileClick()">
				Profile
			</app-dropdown-item>
			<app-dropdown-item (appClick)="onSettingsClick()">
				Settings
			</app-dropdown-item>
			<app-dropdown-item
				[isDisabled]="isLoggingOut()"
				(appClick)="onLogoutClick()"
			>
				Log out
			</app-dropdown-item>
		</app-dropdown-menu>
	}
</div>
@if (imageHasError()) {
	<div
		class="flex items-center justify-center w-[50px] h-[50px] rounded-full bg-surface"
	>
		<i class="ph-fill ph-user text-2xl"></i>
	</div>
} @else {
	<img
		class="block w-[50px] h-[50px] object-cover object-center rounded-full"
		[src]="avatarPath()"
		(error)="onImageError()"
	/>
}
